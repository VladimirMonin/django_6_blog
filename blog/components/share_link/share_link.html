<button
  class="share-link-button share-link-button-{{ variant }}"
  type="button"
  data-share-copy
  data-share-url="{{ url }}"
  aria-label="{{ aria_label }}">
  <i class="bi bi-link-45deg" aria-hidden="true"></i>
  <span data-share-label>{{ label }}</span>
  <span class="visually-hidden" data-share-feedback aria-live="polite" aria-atomic="true"></span>
</button>
